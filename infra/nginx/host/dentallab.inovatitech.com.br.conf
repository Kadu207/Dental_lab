# Dental Lab — nginx do HOST (sistema) → lab-web Docker 127.0.0.1:9180
#
# Instalação:
#   sudo bash /opt/dental-lab-system/infra/ops/install-host-nginx-dentallab.sh
#
# Arquitetura (VPS compartilhada):
#   Cloudflare (SSL Flexible) → host :80 → proxy → lab-web :9180
#
# IMPORTANTE: não use `return 301 https://...` neste server — com Cloudflare Flexible
# isso causa loop infinito (ERR_TOO_MANY_REDIRECTS). TLS termina na borda Cloudflare.
# Sem este vhost, o server_name cai no primeiro listen 80 (ex.: casadapaz) que redireciona a HTTPS.

server {
    listen 80;
    server_name dentallab.inovatitech.com.br;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:9180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Clinica-Id $http_x_clinica_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
